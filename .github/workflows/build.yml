name: Build Enterprise WA Sender Installer

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Setup Electron Configuration
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gegedigi-wa-sender-max",
            "version": "3.0.0",
            "main": "main.js"
          }
          EOF
          cat << 'EOF' > main.js
          const { app, BrowserWindow, session } = require('electron');

          function createWindow () {
            const win = new BrowserWindow({
              width: 1440,
              height: 920,
              minWidth: 1100,
              minHeight: 700,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: true,
                contextIsolation: false,
                webviewTag: true
              }
            });

            const userAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36';
            session.defaultSession.setUserAgent(userAgent);

            win.loadFile('index.html');
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Build Electron App
        run: |
          npm install electron@28.2.0 @electron/packager@18.3.1 --save-dev
          npx @electron/packager . "GegeDigi-WA-Sender" --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Generate Professional NSIS Installer with Directory Choice & Uninstaller
        run: |
          cat << 'EOF' > installer.nsi
          !include "MUI2.nsh"

          Name "GegeDigi WA Sender Pro Max"
          OutFile "GegeDigi-WA-Sender-Setup.exe"
          InstallDir "$PROGRAMFILES64\GegeDigi WA Sender Pro Max"
          InstallDirRegKey HKLM "Software\GegeDigiWASenderMax" "Install_Dir"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !define MUI_ICON "${NSISDIR}\Contrib\Graphics\Icons\modern-install.ico"
          !define MUI_UNICON "${NSISDIR}\Contrib\Graphics\Icons\modern-uninstall.ico"

          ; Halaman Wizard Instalasi
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          ; Halaman Wizard Uninstall
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_UNPAGE_FINISH

          !insertmacro MUI_LANGUAGE "Indonesian"

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "dist/GegeDigi-WA-Sender-win32-x64/*.*"

            ; Buat Uninstaller
            WriteUninstaller "$INSTDIR\Uninstall.exe"

            ; Buat Shortcut Desktop & Start Menu
            CreateShortcut "$DESKTOP\GegeDigi WA Sender Pro Max.lnk" "$INSTDIR\GegeDigi-WA-Sender.exe"
            CreateDirectory "$SMPROGRAMS\GegeDigi WA Sender Pro Max"
            CreateShortcut "$SMPROGRAMS\GegeDigi WA Sender Pro Max\GegeDigi WA Sender Pro Max.lnk" "$INSTDIR\GegeDigi-WA-Sender.exe"
            CreateShortcut "$SMPROGRAMS\GegeDigi WA Sender Pro Max\Uninstall.lnk" "$INSTDIR\Uninstall.exe"

            ; Daftarkan di Windows Settings (Add or Remove Programs)
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GegeDigiWASenderMax" "DisplayName" "GegeDigi WA Sender Pro Max"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GegeDigiWASenderMax" "UninstallString" '"$INSTDIR\Uninstall.exe"'
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GegeDigiWASenderMax" "DisplayIcon" '"$INSTDIR\GegeDigi-WA-Sender.exe"'
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GegeDigiWASenderMax" "Publisher" "gegedigi.com"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GegeDigiWASenderMax" "DisplayVersion" "3.0.0"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\GegeDigi WA Sender Pro Max.lnk"
            Delete "$SMPROGRAMS\GegeDigi WA Sender Pro Max\*.*"
            RMDir "$SMPROGRAMS\GegeDigi WA Sender Pro Max"

            RMDir /r "$INSTDIR"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GegeDigiWASenderMax"
            DeleteRegKey HKLM "Software\GegeDigiWASenderMax"
          SectionEnd
          EOF

      - name: Compile Installer via NSIS
        run: |
          makensis installer.nsi

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: GegeDigi-WA-Sender-Setup
          path: GegeDigi-WA-Sender-Setup.exe
